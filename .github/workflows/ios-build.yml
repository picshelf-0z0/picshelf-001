name: Build iOS App (.IPA) & Simulator Test

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build PicShelf for iPhone (.IPA + iOS Simulator Verification)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Sync Web Assets to iOS Bundle
        run: |
          mkdir -p ios/web
          if [ -d "app/src/main/assets/web" ]; then
            rsync -av --delete --exclude="*.apk" app/src/main/assets/web/ ios/web/
          else
            rsync -av --delete --exclude="*.apk" web/ ios/web/
          fi
          mkdir -p ios/web/models/backdrop_precision
          if [ -f "app/src/main/assets/models/backdrop_precision/manifest.json" ]; then
            cp -f app/src/main/assets/models/backdrop_precision/manifest.json ios/web/models/backdrop_precision/manifest.json
          elif [ -f "models/backdrop_precision/manifest.json" ]; then
            cp -f models/backdrop_precision/manifest.json ios/web/models/backdrop_precision/manifest.json
          fi
          ls -la ios/web ios/web/models/backdrop_precision

      - name: Fetch Official ONNX Runtime iOS XCFramework (NuGet 1.32.0)
        run: |
          python3 - <<'PY'
          import urllib.request, struct, zlib, zipfile, io, os, shutil

          nupkg_url = "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime/1.32.0/microsoft.ml.onnxruntime.1.32.0.nupkg"
          out_dir = "ios/Frameworks"
          os.makedirs(out_dir, exist_ok=True)
          target_xcfw = os.path.join(out_dir, "onnxruntime.xcframework")
          if os.path.exists(target_xcfw):
              shutil.rmtree(target_xcfw)

          req = urllib.request.Request(nupkg_url, method="HEAD")
          with urllib.request.urlopen(req, timeout=30) as r:
              total = int(r.headers["Content-Length"])

          req = urllib.request.Request(nupkg_url, headers={"Range": f"bytes={max(0, total-65536)}-{total-1}"})
          with urllib.request.urlopen(req, timeout=30) as r:
              tail = r.read()
          idx = tail.rfind(b"PK\x05\x06")
          cd_size, cd_offset = struct.unpack_from("<II", tail, idx + 12)

          req = urllib.request.Request(nupkg_url, headers={"Range": f"bytes={cd_offset}-{cd_offset+cd_size-1}"})
          with urllib.request.urlopen(req, timeout=30) as r:
              cd = r.read()

          pos = 0
          xcfw_entry = None
          while pos + 46 <= len(cd) and cd[pos:pos+4] == b"PK\x01\x02":
              method = struct.unpack_from("<H", cd, pos + 10)[0]
              comp_sz, uncomp_sz, fn_len, ex_len, cm_len = struct.unpack_from("<IIHHH", cd, pos + 20)
              lfh_off = struct.unpack_from("<I", cd, pos + 42)[0]
              fn = cd[pos+46:pos+46+fn_len].decode("utf-8", errors="replace")
              if fn == "runtimes/ios/native/onnxruntime.xcframework.zip":
                  xcfw_entry = (method, comp_sz, uncomp_sz, lfh_off)
                  break
              pos += 46 + fn_len + ex_len + cm_len

          assert xcfw_entry is not None, "onnxruntime.xcframework.zip not found in NuGet package"
          method, comp_sz, uncomp_sz, lfh_off = xcfw_entry
          print(f"Fetching onnxruntime.xcframework.zip ({comp_sz/1e6:.1f} MB) from NuGet...")
          req = urllib.request.Request(nupkg_url, headers={"Range": f"bytes={lfh_off}-{lfh_off+30+256+comp_sz}"})
          with urllib.request.urlopen(req, timeout=120) as r:
              buf = r.read()
          fnl, exl = struct.unpack_from("<HH", buf, 26)
          raw = buf[30+fnl+exl:30+fnl+exl+comp_sz]
          zbytes = raw if method == 0 else zlib.decompress(raw, -15)

          with zipfile.ZipFile(io.BytesIO(zbytes)) as zf:
              zf.extractall(out_dir)
          print("Extracted:", os.listdir(target_xcfw))
          PY
          test -f ios/Frameworks/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/Headers/onnxruntime_c_api.h
          ls -lh ios/Frameworks/onnxruntime.xcframework/ios-arm64/onnxruntime.framework/onnxruntime

      - name: Build Xcode Archive (iOS Device arm64)
        run: |
          xcodebuild clean archive \
            -project ios/AuraPhotoOrganizer.xcodeproj \
            -scheme AuraPhotoOrganizer \
            -configuration Release \
            -archivePath build/AuraPhotoOrganizer.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package App into Sideloadable IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AuraPhotoOrganizer.xcarchive/Products/Applications/AuraPhotoOrganizer.app build/Payload/
          cd build
          zip -qr9 PicShelf.ipa Payload
          cp PicShelf.ipa AuraPhotoOrganizer.ipa
          ls -lh PicShelf.ipa AuraPhotoOrganizer.ipa

      - name: Build & Verify on Apple iOS Simulator
        continue-on-error: true
        run: |
          xcodebuild build \
            -project ios/AuraPhotoOrganizer.xcodeproj \
            -scheme AuraPhotoOrganizer \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          SIM_APP=$(find build/DerivedData -name "AuraPhotoOrganizer.app" -path "*iphonesimulator*" | head -n 1)
          echo "Simulator App Path: $SIM_APP"
          DEVICE_UDID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Booting iOS Simulator UDID: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          perl -e 'alarm 120; exec @ARGV' xcrun simctl bootstatus "$DEVICE_UDID" -b || true
          perl -e 'alarm 60; exec @ARGV' xcrun simctl install "$DEVICE_UDID" "$SIM_APP" || true
          perl -e 'alarm 30; exec @ARGV' xcrun simctl launch "$DEVICE_UDID" com.aistudio.photoorganizer.xwylza || true
          sleep 6
          perl -e 'alarm 30; exec @ARGV' xcrun simctl io "$DEVICE_UDID" screenshot build/ios-simulator-screenshot.png || true
          xcrun simctl shutdown "$DEVICE_UDID" || true
          ls -lh build/ios-simulator-screenshot.png || true

      - name: Upload IPA & Simulator Screenshot Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraPhotoOrganizer-iOS-IPA
          path: |
            build/PicShelf.ipa
            build/AuraPhotoOrganizer.ipa
            build/ios-simulator-screenshot.png
          retention-days: 14
          if-no-files-found: warn

      - name: Publish Latest IPA Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-ipa
          name: "PicShelf iOS (.IPA) & Simulator Verification"
          body: "Automated Xcode macOS build of PicShelf (`PicShelf.ipa` / `AuraPhotoOrganizer.ipa`) and live iOS Simulator verification screenshot."
          files: |
            build/PicShelf.ipa
            build/AuraPhotoOrganizer.ipa
            build/ios-simulator-screenshot.png
          prerelease: false
